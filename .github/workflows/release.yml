name: Release skill

# Cut a release by pushing a version tag, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
#
# ONE universal zip is published. It unzips to a folder named `aprimo-references`
# and bin/ carries all three compiler binaries:
#
#   aprimo-references.zip   transpiler.exe (Windows) + transpiler (macOS arm64)
#                           + transpiler-linux (Linux x86-64, also claude.ai's sandbox)
#
# The compiler is a dependency-light Go tree interpreter (~4 MB per binary since the
# JS/goja layer was removed), so all three fit comfortably under the 30 MB unpacked
# skill limit that previously forced per-OS zips.
#
# The binaries are pre-built and committed (the compiler source is not public), so this
# workflow only repackages the committed tree -- it never compiles anything.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # manual run: builds the zip and uploads it as a workflow artifact

permissions:
  contents: write # needed to create the release and upload the assets

env:
  SKILL: aprimo-references
  MAX_BIN_KB: 30720 # 30 MB -- unpacked bin/ must stay under the skill size limit

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the universal skill zip
        run: |
          set -euo pipefail
          ROOT="$PWD"

          # Export the committed tree. tar (not zip) so the executable bit stored
          # in the git index survives into the staging copy; .gitattributes export-ignore
          # keeps .github/ and .gitattributes out.
          rm -rf stage && mkdir stage
          git archive --format=tar --prefix="$SKILL/" HEAD | tar -x -C stage

          kb=$(du -sk "stage/$SKILL/bin" | cut -f1)
          if [ "$kb" -gt "$MAX_BIN_KB" ]; then
            echo "::error::bin/ is ${kb} KB unpacked, over the ${MAX_BIN_KB} KB skill limit"
            exit 1
          fi

          ( cd stage && zip -qr9 "$ROOT/$SKILL.zip" "$SKILL" )
          printf 'zip %6s   bin/ unpacked %6s   [%s]\n' \
            "$(du -h "$SKILL.zip" | cut -f1)" \
            "$(du -sh "stage/$SKILL/bin" | cut -f1)" \
            "$(ls "stage/$SKILL/bin" | tr '\n' ' ')"

          echo "--- zip contents ---"
          unzip -l "$SKILL.zip"

      - name: Attach zip to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.SKILL }}.zip
          append_body: true
          body: |
            One universal download: `${{ env.SKILL }}.zip` works on Windows, macOS,
            Linux, and claude.ai in the browser (its sandbox is Linux x86-64). The
            bundle carries all three compiler binaries; the skill picks the right
            one for the host at runtime.

      - name: Upload zip as artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SKILL }}-zip
          path: ${{ env.SKILL }}.zip
